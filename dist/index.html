<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestiona tu equipo de Azure DevOps: planificación de iteraciones y mantenimiento.">
  <title>Neo Team · Gestión del equipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Saltar al contenido</a>
  <div class="app-shell">

    <div class="workspace">
      <header class="topbar"><div class="product-name"><button class="brand-home" type="button" data-action="home" aria-label="Neo Team · Ir al inicio">neo<span>team</span></button><span class="divider">/</span><span class="workspace-label">Inicio</span></div><div class="header-actions"><span id="save-status" role="status"></span><div class="mode-toggle" role="group" aria-label="Modo de trabajo"><button type="button" data-action="set-mode" data-mode="demo" aria-pressed="false">Prueba</button><button type="button" data-action="set-mode" data-mode="azure" aria-pressed="false">Azure DevOps</button></div><button type="button" id="sync-button" class="button sync-button" data-action="review" aria-label="Sincronización: ver cambios pendientes" title="Ver cambios pendientes de sincronizar" aria-haspopup="dialog" aria-controls="sync-panel"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg></button></div></header>
      <div class="mode-banner" id="mode-banner" role="status"><span></span></div>
      <main id="app" aria-label="Planificación" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="sync-panel" class="sync-panel" aria-labelledby="sync-title"><header class="sync-panel-head"><div><h2 id="sync-title">Sincronización</h2><p>Todos los proyectos e iteraciones</p></div><button type="button" class="close" data-action="close-sync" aria-label="Cerrar sincronización" autofocus>×</button></header><div id="sync-content" class="sync-panel-content"></div></dialog>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
