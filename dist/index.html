<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestiona tu equipo de Azure DevOps: planificación de iteraciones y mantenimiento.">
  <title>Neo Team · Gestión del equipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Saltar al contenido</a>
  <div class="app-shell">

    <div class="workspace">
      <header class="topbar"><div class="product-name"><button class="brand-home" type="button" data-action="home" aria-label="Neo Team · Ir al inicio">neo<span>team</span></button><span class="divider">/</span><span class="workspace-label">Inicio</span></div><div class="header-actions"><span id="save-status" role="status"></span><button class="button subtle" id="connection-button">Conectar Azure DevOps</button></div></header>
      <nav class="section-nav" aria-label="Secciones"><button data-action="home" data-section="Inicio">Inicio</button><button data-action="open-planning" data-section="Planificación">Planificación</button><button data-action="open-maintenance" data-section="Mantenimiento">Mantenimiento</button><button data-action="open-reviews" data-section="Revisión de PRs">Revisión de PRs</button><button data-action="permissions" data-section="Permisos">Permisos</button><button class="pending-shortcut" data-action="review" id="pending-shortcut" hidden></button></nav>
      <div class="demo-banner" id="demo-banner" hidden><span><strong>Modo de ejemplo</strong> · Los cambios y las publicaciones se simulan.</span><button class="link-button" data-action="azure">Salir del ejemplo</button></div>
      <main id="app" aria-label="Planificación" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
